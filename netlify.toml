# Netlify project configuration — deploy this repo as a Netlify site and
# the app runs with real accounts + a real database:
#
#   1. Neon   → create a project, copy the pooled connection string
#   2. Netlify → Site configuration → Environment variables:
#                  DATABASE_URL = postgresql://…neon.tech/neondb?sslmode=require&pgbouncer=true&connection_limit=1
#   3. Netlify → Site configuration → Identity → Enable Identity
#               (keep "Open" registration, or add yourself via "Invite users")
#   4. Deploy  → tables are created automatically on the first request
#
# See DEPLOY.md for the full walkthrough.

[build]
  # Production uses the Postgres (Neon) schema; the SQLite schema is only
  # generated for local dev, never on Netlify.
  command = "npx prisma generate --schema prisma/schema.pg.prisma && npx next build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[dev]
  command = "npm run dev"
  targetPort = 3000
