<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Momentum brand mark: the letter M drawn as an ascending progress
       line — up, dip, up — whose final stroke breaks out of the letter as
       an upward arrow. Green = the app's primary color across all themes. -->
  <defs>
    <linearGradient id="mg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19C48D"/>
      <stop offset="1" stop-color="#0A8A5D"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#mg)"/>
  <!-- optical sizing: the glyph is slightly enlarged so it survives 16–32px
       tab renders; the ICO/apple-touch assets use per-size cuts -->
  <g transform="translate(32 32) scale(1.15) translate(-32 -32)"
     fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- the M / momentum line -->
    <polyline points="15,46 24.5,29.5 34,39.5 49,17.5"/>
    <!-- the breakout arrowhead -->
    <polyline points="41.5,17.5 49,17.5 49,25"/>
  </g>
</svg>
